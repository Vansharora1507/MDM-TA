<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div><h1>Student Management System</h1><p>Manage student records quickly and efficiently.</p></div><div class="status-badge">Flask + SQLite</div></header>
<main class="container">
<section class="card form-card"><div class="section-heading"><div><h2 id="formTitle">Add Student</h2><p>Enter the student's details below.</p></div><button id="cancelEdit" class="secondary-btn hidden" type="button">Cancel Edit</button></div>
<form id="studentForm"><div class="form-grid">
<label>Name<input id="name" type="text" placeholder="Enter full name" required></label>
<label>Roll Number<input id="roll_no" type="text" placeholder="Enter roll number" required></label>
<label>Class<input id="class_name" type="text" placeholder="e.g. ENCS-B" required></label>
<label>Marks<input id="marks" type="number" min="0" max="100" step="0.01" placeholder="0 - 100" required></label>
<label>Contact<input id="contact" type="tel" maxlength="10" placeholder="10-digit number" required></label>
<label>Email<input id="email" type="email" placeholder="student@example.com" required></label>
</div><div class="form-actions"><button class="primary-btn" type="submit" id="submitBtn">Add Student</button><button class="secondary-btn" type="reset" id="clearBtn">Clear</button></div></form><div id="message" class="message hidden"></div></section>
<section class="card records-card"><div class="section-heading records-heading"><div><h2>Student Records</h2><p id="recordCount">0 students</p></div><div class="search-box"><input id="searchInput" type="search" placeholder="Search by name or roll number"><button id="searchBtn" class="secondary-btn" type="button">Search</button></div></div>
<div class="table-wrapper"><table><thead><tr><th>Name</th><th>Roll No.</th><th>Class</th><th>Marks</th><th>Contact</th><th>Email</th><th>Actions</th></tr></thead><tbody id="studentTableBody"></tbody></table><div id="emptyState" class="empty-state">No student records found.</div></div></section>
</main><script src="script.js"></script>
</body></html>
